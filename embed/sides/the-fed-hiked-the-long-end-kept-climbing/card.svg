<title id="card-title">Who is on each side: The Fed Hiked. The Long End Still Climbed.</title>
<desc id="card-desc">Why did the long end climb after the hike: growth, debt, or a missing buyer? 21 voices on 3 sides: Growth: yields are catching up 6, Debt: 99% of GDP, up from 35% 9, A missing buyer 6. The DeepStack call sides with A missing buyer. Skeptical, conviction high. Analysis and opinion, not investment advice.</desc>
